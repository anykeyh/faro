# Faro configuration
# ────────────────
# db: ":memory:" for in-memory, or a filesystem path like "./data/faro.db"
# adapters: list of probe scripts to run periodically
# thresholds: named alerts that open/close latches based on metric values
# server: HTTP API bind address and port

db: "duckdb://[:memory:]"

server:
  host: "0.0.0.0"
  port: 3000

adapters:
  # Each probe is an executable that writes JSON to stdout.
  # On failure it returns alive=0 and exits 0 so thresholds can trigger.
  # collect_interval: polling frequency in seconds (float, min 1.0, default 10)

  - name: cpu
    run: ./probes/cpu.sh
    collect_interval: 5.0

  - name: memory
    run: ./probes/memory.sh
    collect_interval: 5.0

  - name: disk
    run: ./probes/disk.sh
    collect_interval: 30.0

  - name: pg-prod
    run: ./probes/pg_check.sh
    collect_interval: 10.0
    env:
      PG_URI: postgresql://monitor:secret@db.internal:5432/production

  - name: mysql-staging
    run: ./probes/mysql_check.sh
    collect_interval: 15.0
    env:
      MYSQL_URI: mysql://root:pass@staging-db:3306/app

  - name: redis-cache
    run: ./probes/redis_check.sh
    collect_interval: 5.0
    env:
      REDIS_URI: redis-cache.internal:6379

  - name: docker-api
    run: ./probes/docker_check.sh
    collect_interval: 10.0
    via:
      type: docker
      container: api-gateway
    env:
      DOCKER_CONTAINER: api-gateway

  - name: curl-homepage
    run: ./probes/curl_check.sh
    collect_interval: 30.0
    via:
      type: docker
      container: nginx-proxy
    env:
      CURL_URL: http://localhost/health
      CURL_TIMEOUT: "5"

  - name: http-homepage
    run: ./probes/curl_check.sh
    collect_interval: 60.0
    env:
      CURL_URL: https://example.com
      CURL_TIMEOUT: "5"

thresholds:
  - name: pg-down
    metric: pg-prod.alive
    latches:
      - name: down
        set: 0
        release: 1

  - name: mysql-down
    metric: mysql-staging.alive
    latches:
      - name: down
        set: 0
        release: 1

  - name: redis-down
    metric: redis-cache.alive
    latches:
      - name: down
        set: 0
        release: 1

  - name: docker-api-down
    metric: docker-api.alive
    latches:
      - name: down
        set: 0
        release: 1

  - name: curl-slow
    metric: curl-homepage.time_total_ms
    latches:
      - name: slow
        set: 2000
        release: 500
