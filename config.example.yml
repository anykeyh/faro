# Faro example configuration
# Run: crystal run src/main.cr -- -c config.example.yml
# Then open http://localhost:3000

db: ":memory:"

server:
  host: "0.0.0.0"
  port: 3000

adapters:
  - name: cpu
    run: ./probes/cpu.sh
    collect_interval: 5.0

  - name: memory
    run: ./probes/memory.sh
    collect_interval: 5.0

  - name: disk
    run: ./probes/disk.sh
    collect_interval: 10.0

thresholds: []
