# Faro example configuration
# Run: crystal run src/main.cr -- -c config.example.yml
# Then open http://localhost:3000

db: ":memory:"

server:
  host: "0.0.0.0"
  port: 3000

adapters:
  - name: cpu
    run: $cpu
    collect_interval: 5s

  - name: memory
    run: $memory
    collect_interval: 5s

  - name: disk
    run: $disk
    collect_interval: 10s

  - name: load
    run: $load
    collect_interval: 5s

  - name: swap
    run: $swap
    collect_interval: 30s

thresholds:
  - name: cpu-high
    metric: cpu.usage_pct
    latches:
      - name: critical
        set: 90
        release: 70
        sustain: 30s

      - name: sustained
        set: 80
        release: 60
        sustain: 5m

  - name: alive-check
    metric: cpu._alive
    latches:
      - name: dead
        set: 0.5
        release: 0.9
        sustain: 10
