# Faro example configuration
# Run: crystal run src/main.cr -- -c config.example.yml
# Then open http://localhost:3000

db: "sqlite3://:memory:"

# Log level: trace, debug, info, warn, error, fatal
log_level: trace

server:
  host: "0.0.0.0"
  port: 3000
  # Optional HTTP Basic Auth — uncomment to enable
  # basic_auth:
  #   username: admin
  #   password: admin

# System probes to auto-start at 5s interval.
# Comment out or set to [] to disable all.
# Custom probes below override by name.
probes:
  - $cpu
  - $memory
  - $disk
  - $load
  - $network
  - $swap

# Custom adapters (not in probes) — add user-defined scripts or override system ones.
adapters:
  - name: cpu
    run: $cpu
    collect_interval: 2s

  - name: custom_app
    run: /usr/local/bin/my_probe.sh
    collect_interval: 30s

thresholds:
  - name: cpu-high
    metric: cpu.usage_pct
    latches:
      - name: critical
        set: 0.9
        release: 0.7
        sustain: 30s

      - name: sustained
        set: 0.8
        release: 0.6
        sustain: 5m

  - name: alive-check
    metric: cpu._alive
    latches:
      - name: dead
        set: 0.5
        release: 0.9
        sustain: 10
