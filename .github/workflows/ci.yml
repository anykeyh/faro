name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v6

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install SQLite3 headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Install dependencies
        run: shards install --production

      - name: Run tests
        run: crystal spec

  build:
    name: Build (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            binary_name: faro-linux-amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            binary_name: faro-linux-arm64

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build static binary via Docker
        run: |
          docker build --target builder -t faro-builder .
          id=$(docker create faro-builder)
          docker cp "$id":/build/faro ${{ matrix.binary_name }}
          docker rm "$id" > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            faro-linux-amd64
            faro-linux-arm64
          generate_release_notes: true

      - name: Update latest tag and upload artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force
          gh release upload latest faro-linux-amd64/faro-linux-amd64 faro-linux-arm64/faro-linux-arm64 --clobber || \
            gh release create latest faro-linux-amd64/faro-linux-amd64 faro-linux-arm64/faro-linux-arm64 --generate-notes --title "Latest build"
