name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  DUCKDB_VERSION: v1.2.1

jobs:
  test:
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            duckdb_file: libduckdb-linux-amd64.zip
          - os: ubuntu-24.04-arm
            arch: arm64
            duckdb_file: libduckdb-linux-aarch64.zip

    steps:
      - uses: actions/checkout@v6

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install SQLite3 headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Install DuckDB library
        run: |
          curl -fsSL \
            "https://github.com/duckdb/duckdb/releases/download/${{ env.DUCKDB_VERSION }}/${{ matrix.duckdb_file }}" \
            -o /tmp/libduckdb.zip
          sudo unzip -o /tmp/libduckdb.zip -d /tmp/libduckdb
          sudo cp /tmp/libduckdb/libduckdb.so /usr/local/lib/
          sudo ldconfig

      - name: Install dependencies
        run: shards install --production

      - name: Run tests
        run: crystal spec

  build:
    name: Build (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            duckdb_file: libduckdb-linux-amd64.zip
            binary_name: faro-linux-amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            duckdb_file: libduckdb-linux-aarch64.zip
            binary_name: faro-linux-arm64

    steps:
      - uses: actions/checkout@v6

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install SQLite3 headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Install DuckDB library
        run: |
          curl -fsSL \
            "https://github.com/duckdb/duckdb/releases/download/${{ env.DUCKDB_VERSION }}/${{ matrix.duckdb_file }}" \
            -o /tmp/libduckdb.zip
          sudo unzip -o /tmp/libduckdb.zip -d /tmp/libduckdb
          sudo cp /tmp/libduckdb/libduckdb.so /usr/local/lib/
          sudo ldconfig

      - name: Install dependencies
        run: shards install --production

      - name: Build release binary
        run: crystal build src/main.cr --release -o ${{ matrix.binary_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            faro-linux-amd64/faro-linux-amd64
            faro-linux-arm64/faro-linux-arm64
          generate_release_notes: true

      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force
